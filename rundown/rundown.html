<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Rundown</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="rundown.css">
</head>
<body>
  <main class="rundown-shell">
    <header class="app-header rundown-header">
      <img src="../icons/inboxai.svg" alt="">
      <h1>Daily Email Rundown</h1>
    </header>

    <section class="rundown-content" aria-live="polite">
      <div id="status" class="status loading visible">Loading unread emails...</div>
      <article id="report"></article>
    </section>
  </main>

  <script src="../lib/ai_service.js"></script>
  <script src="../lib/message_text.js"></script>
  <script src="rundown.js"></script>
</body>
</html>
