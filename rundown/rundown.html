<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Rundown</title>
  <script src="../shared/theme.js"></script>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="rundown.css">
</head>
<body>
  <main class="rundown-shell">
    <header class="app-header rundown-header">
      <img src="../icons/inboxai.svg" alt="">
      <h1>Daily Email Rundown</h1>
    </header>

    <section class="rundown-content">
      <div id="status" class="status loading visible" role="status" aria-live="polite">Loading unread emails...</div>
      <div id="report-toolbar" class="toolbar report-toolbar" hidden>
        <span id="report-meta" class="report-meta"></span>
        <span class="spacer"></span>
        <button id="btn-copy" type="button">Copy</button>
        <button id="btn-refresh" type="button" class="secondary">Refresh</button>
      </div>
      <article id="report"></article>
    </section>
  </main>

  <script src="../lib/ai_service.js"></script>
  <script src="../lib/jev_service.js"></script>
  <script src="../lib/message_text.js"></script>
  <script src="rundown.js"></script>
</body>
</html>
