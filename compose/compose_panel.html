<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>InboxAI Assistant</title>
  <style>
    :root {
      color-scheme: light;
      --accent: #0060df;
      --accent-hover: #0250bb;
      --border: #c9ced8;
      --border-strong: #aab2c0;
      --surface: #f7f8fa;
      --text: #202124;
      --muted: #5f6673;
      --danger: #c50042;
    }

    body {
      width: 340px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background: #fff;
      padding: 14px;
      box-sizing: border-box;
    }

    .title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 14px;
      font-size: 15px;
      line-height: 1.2;
    }

    .title img {
      width: 24px;
      height: 24px;
      flex: 0 0 auto;
    }

    .section {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
    }

    textarea {
      width: 100%;
      height: 80px;
      box-sizing: border-box;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px;
      font: inherit;
      line-height: 1.35;
    }

    textarea:focus {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 0 2px rgba(0, 96, 223, 0.18);
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .button-row.single {
      grid-template-columns: 1fr;
    }

    button {
      min-height: 34px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
      padding: 8px 10px;
      transition: background-color 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
    }

    button:hover:not(:disabled) {
      background: #eef1f5;
      border-color: var(--border-strong);
    }

    button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px rgba(0, 96, 223, 0.24);
    }

    button:disabled {
      cursor: default;
      opacity: 0.58;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    button.primary:hover:not(:disabled) {
      border-color: var(--accent-hover);
      background: var(--accent-hover);
    }

    hr {
      border: 0;
      border-top: 1px solid #e4e7eb;
      margin: 12px 0;
    }

    .error {
      color: var(--danger);
      font-size: 12px;
      margin-top: 7px;
    }

    .loading {
      color: var(--muted);
      font-size: 12px;
      display: none;
      margin-top: 8px;
    }

    #result-container {
      margin-top: 12px;
    }

    #result-text {
      height: 112px;
    }
  </style>
</head>
<body>
  <h3 class="title"><img src="../icons/inboxai.svg" alt="">InboxAI Assistant</h3>
  
  <div class="section">
    <label for="prompt">Write</label>
    <textarea id="prompt" placeholder="Describe the email you want to write..."></textarea>
    <div class="button-row">
      <button id="btn-write" class="primary">Write Draft</button>
      <button id="btn-reply">Reply Draft</button>
    </div>
  </div>

  <hr>

  <div class="section">
    <label>Current Draft</label>
    <div class="button-row">
      <button id="btn-polish">Polish Draft</button>
      <button id="btn-shorten">Shorten Draft</button>
    </div>
  </div>

  <div id="status" class="loading">Processing...</div>
  <div id="error" class="error"></div>
  
  <div id="result-container" style="display:none;">
    <label>Result</label>
    <textarea id="result-text" readonly></textarea>
    <div class="button-row">
      <button id="btn-insert" class="primary">Insert into Draft</button>
      <button id="btn-copy">Copy to Clipboard</button>
    </div>
  </div>

  <script src="../lib/ai_service.js"></script>
  <script src="../lib/message_text.js"></script>
  <script src="compose_panel.js"></script>
</body>
</html>
