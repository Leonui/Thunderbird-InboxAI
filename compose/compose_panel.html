<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InboxAI Assistant</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="compose_panel.css">
</head>
<body>
  <main class="compose-panel">
    <header class="app-header">
      <img src="../icons/inboxai.svg" alt="">
      <h1>InboxAI Assistant</h1>
    </header>

    <section class="section" aria-labelledby="write-label">
      <label id="write-label" for="prompt" class="field-label">Write</label>
      <textarea id="prompt" placeholder="Describe the email you want to write..."></textarea>
      <div class="button-row">
        <button id="btn-write" class="primary" type="button">Write Draft</button>
        <button id="btn-reply" class="secondary" type="button">Reply Draft</button>
      </div>
    </section>

    <section class="section panel draft-actions" aria-labelledby="draft-label">
      <span id="draft-label" class="field-label">Current Draft</span>
      <div class="button-row">
        <button id="btn-polish" type="button">Polish Draft</button>
        <button id="btn-shorten" type="button">Shorten Draft</button>
      </div>
    </section>

    <section class="feedback" aria-live="polite">
      <div id="status" class="status"></div>
      <div id="error" class="error"></div>
    </section>

    <section id="result-container" class="section" aria-labelledby="result-label">
      <label id="result-label" for="result-text" class="field-label">Result</label>
      <textarea id="result-text" readonly></textarea>
      <div class="button-row">
        <button id="btn-insert" class="primary" type="button">Insert into Draft</button>
        <button id="btn-copy" type="button">Copy to Clipboard</button>
      </div>
    </section>
  </main>

  <script src="../lib/ai_service.js"></script>
  <script src="../lib/message_text.js"></script>
  <script src="compose_panel.js"></script>
</body>
</html>
