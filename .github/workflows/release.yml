name: Build and Release Extension

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. v1.0.0'
        required: true
        type: string
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0, v0.1.0, etc.

jobs:
  build_and_release:
    name: Build XPI and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for creating releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Build XPI Package
        run: |
          # Create the .xpi file (zipping the contents)
          zip -r inbox-ai.xpi . -x "*.git*" -x "*.github*" -x "*.DS_Store*" -x ".gitignore" -x "*.sh"
          echo "XPI package created: inbox-ai.xpi"

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: inbox-ai.xpi
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
